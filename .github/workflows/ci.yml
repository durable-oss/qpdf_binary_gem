name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Lint code for consistent style
        run: bundle exec rubocop -f github

  # Unit tests against fake binaries. Tests that need the real qpdf skip
  # here and run in the package job instead.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.1", "3.2", "3.3", "3.4"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true

      - name: Run tests
        run: bundle exec rake test

  # The gemspec supports Ruby >= 2.7, but Gemfile.lock pins a Bundler that
  # requires >= 3.1. Resolve dependencies fresh on the older Rubies so the
  # support claim stays tested rather than merely advertised.
  test-legacy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby-version: "2.7"
            bundler: "2.4.22"
          - ruby-version: "3.0"
            bundler: "2.4.22"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby ${{ matrix.ruby-version }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler: ${{ matrix.bundler }}
          bundler-cache: false

      - name: Resolve dependencies without the checked-in lockfile
        run: |
          rm -f Gemfile.lock
          bundle install --jobs 4 --retry 3

      - name: Run tests
        run: bundle exec rake test

  binaries:
    uses: ./.github/workflows/binaries.yml

  # Package the gem with both binaries, install it, and run the installed
  # qpdf, the way a user would get it.
  package:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Download the binaries
        uses: actions/download-artifact@v4
        with:
          pattern: qpdf-linux-*
          path: libexec
          merge-multiple: true

      - name: Run tests against the real binary
        run: bundle exec rake test

      - name: Build the gem
        run: bundle exec rake build

      - name: Install the built gem
        run: gem install --local --no-document pkg/qpdf-binary-*.gem

      # Run from outside the checkout, with a read-only gem directory, so the
      # installed gem and its cache-directory fallback are what get tested.
      - name: Smoke test the installed gem
        working-directory: ${{ runner.temp }}
        run: |
          gem_dir="$(ruby -e 'print Gem::Specification.find_by_name("qpdf-binary").gem_dir')"
          chmod -R a-w "$gem_dir"
          trap 'chmod -R u+w "$gem_dir"' EXIT

          qpdf --version
          qpdf --show-crypto | grep -qx openssl

          path="$(ruby -rqpdf_binary -e 'print QpdfBinary.path')"
          echo "extracted to $path"
          case "$path" in
            "$gem_dir"/*) echo "expected the cache fallback, got the read-only gem dir" >&2; exit 1 ;;
          esac
