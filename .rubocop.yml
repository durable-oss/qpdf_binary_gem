plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 2.7
  NewCops: enable
  Exclude:
    - 'vendor/**/*'
    - 'test/dummy/**/*'
    - 'bin/**/*'
    - 'tmp/**/*'
    - 'coverage/**/*'
    - 'worktrees/**/*'
    - 'local/**/*'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  Enabled: true
  EnforcedStyle: double_quotes

Metrics/MethodLength:
  Max: 50
  Exclude:
    - 'test/**/*'

Metrics/ClassLength:
  Max: 300
  Exclude:
    - 'test/**/*'

Metrics/BlockLength:
  Exclude:
    - 'test/**/*'
    - 'Rakefile'
    - '**/*.rake'
    - '**/*.gemspec'

Layout/LineLength:
  Max: 120
  Exclude:
    - 'test/**/*'

Metrics/AbcSize:
  Max: 30
  Exclude:
    - 'test/**/*'

Metrics/CyclomaticComplexity:
  Max: 10

Metrics/PerceivedComplexity:
  Max: 10

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: always

# Durable Programming gem convention keeps development dependencies in the
# gemspec (spec.add_development_dependency) rather than the Gemfile.
Gemspec/DevelopmentDependencies:
  Enabled: false

# lib/qpdf-binary.rb must match the gem name so Bundler.require loads it.
Naming/FileName:
  Exclude:
    - lib/qpdf-binary.rb

# Architecture names such as x86_64 and aarch64 are proper nouns; normalcase
# (x8664) would obscure them.
Naming/VariableNumber:
  Enabled: false
